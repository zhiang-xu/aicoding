<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ page.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></h1>
    {% if site.description %}
    <p>{{ site.description }}</p>
    {% endif %}
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
